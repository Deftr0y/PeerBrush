name: PeerBrush native Windows installer qualification
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed stable main and workflow SHA
        required: true
        type: string
      selection_json:
        description: Reviewed public source/artifact/media/tool/leaf/URI selections; no credentials
        required: true
        type: string
      selection_sha256:
        description: Independently reviewed SHA256 of exact UTF8 selection JSON
        required: true
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: windows-native-qualification-${{ github.sha }}
  cancel-in-progress: false
env:
  SELECTED_COMMIT: ${{ inputs.expected_commit }}
  SELECTION_JSON: ${{ inputs.selection_json }}
  SELECTION_SHA256: ${{ inputs.selection_sha256 }}
  PEERBRUSH_WINDOWS_QUALIFICATION_ENABLED: ${{ vars.PEERBRUSH_WINDOWS_QUALIFICATION_ENABLED }}
jobs:
  gate:
    name: gate
    # Literal hold: variables/dispatch alone cannot activate this producer.
    if: ${{ false }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require reviewed main invocation
        run: |
          python -I - <<'PY'
          import os, re
          selected = os.environ.get('SELECTED_COMMIT', '')
          required = {
              'GITHUB_REPOSITORY': 'Deftr0y/PeerBrush', 'GITHUB_REF': 'refs/heads/main',
              'GITHUB_REPOSITORY_ID': '1407648785', 'GITHUB_REPOSITORY_OWNER_ID': '21202494',
              'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_WORKFLOW_REF': 'Deftr0y/PeerBrush/.github/workflows/windows-qualification.yml@refs/heads/main',
              'GITHUB_SHA': selected, 'GITHUB_WORKFLOW_SHA': selected, 'GITHUB_RUN_ATTEMPT': '1',
              'RUNNER_ENVIRONMENT': 'github-hosted',
              'RUNNER_OS': 'Windows', 'RUNNER_ARCH': 'X64', 'PEERBRUSH_WINDOWS_QUALIFICATION_ENABLED': 'true',
          }
          if not re.fullmatch('[0-9a-f]{40}', selected) or any(os.environ.get(key) != value for key, value in required.items()):
              raise SystemExit('Require reviewed exact main and approved native invocation before checkout.')
          PY
      - name: Checkout reviewed main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact main source
        run: |
          python -B scripts/release_gate.py --commit "$SELECTED_COMMIT"
          python -I - <<'PY'
          import hashlib, os, pathlib, re
          data = os.environ['SELECTION_JSON'].encode('utf-8')
          expected = os.environ['SELECTION_SHA256']
          if not 0 < len(data) <= 32768 or not re.fullmatch('[0-9a-f]{64}', expected) or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Reviewed bounded public selection differs from its independent digest.')
          with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-native-selection.json').open('xb') as stream:
              stream.write(data)
          PY
      - if: runner.os == 'Windows'
        name: Initialize existing MSVC SDK for native codec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeTools = @{}
          foreach ($name in @('clang-cl', 'cmake', 'ninja')) {
            $nativeTools[$name] = (Get-Command $name -CommandType Application -TotalCount 1 -ErrorAction Stop).Source
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'Existing Visual Studio C++ tools unavailable' }
          $launch = Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1'
          & $launch -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python -B scripts/jxl_build.py --github-env --selected-clang-cl ($nativeTools['clang-cl']) --selected-cmake ($nativeTools['cmake']) --selected-ninja ($nativeTools['ninja'])
          if ($LASTEXITCODE -ne 0) { throw 'Native codec tool qualification failed' }
      - if: runner.os != 'Windows'
        name: Select existing native codec tools
        run: python3 -B scripts/jxl_build.py --github-env
      - name: Verify native codec tool selection regressions
        run: python -B scripts/test_jxl_build.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # Rust 1.92.0
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy, rust-docs
      - name: Test exact source without native attestation authority
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path vendor/cmake/Cargo.toml -- --check
          rustfmt --check --edition 2021 tests/fixtures/native-build-flags/src/main.rs
          cargo build --locked --bin peerbrush
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B scripts/package.py --check-source

  qualify:
    name: qualify
    needs: gate
    if: ${{ false }}
    runs-on: windows-2025
    environment: windows-native-qualification
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require reviewed main invocation
        run: |
          python -I - <<'PY'
          import os, re
          selected = os.environ.get('SELECTED_COMMIT', '')
          required = {
              'GITHUB_REPOSITORY': 'Deftr0y/PeerBrush', 'GITHUB_REF': 'refs/heads/main',
              'GITHUB_REPOSITORY_ID': '1407648785', 'GITHUB_REPOSITORY_OWNER_ID': '21202494',
              'GITHUB_EVENT_NAME': 'workflow_dispatch',
              'GITHUB_WORKFLOW_REF': 'Deftr0y/PeerBrush/.github/workflows/windows-qualification.yml@refs/heads/main',
              'GITHUB_SHA': selected, 'GITHUB_WORKFLOW_SHA': selected, 'GITHUB_RUN_ATTEMPT': '1',
              'RUNNER_ENVIRONMENT': 'github-hosted',
              'RUNNER_OS': 'Windows', 'RUNNER_ARCH': 'X64', 'PEERBRUSH_WINDOWS_QUALIFICATION_ENABLED': 'true',
          }
          if not re.fullmatch('[0-9a-f]{40}', selected) or any(os.environ.get(key) != value for key, value in required.items()):
              raise SystemExit('Require reviewed exact main and approved native invocation before checkout.')
          PY
      - name: Checkout reviewed main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact main source
        run: |
          python -B scripts/release_gate.py --commit "$SELECTED_COMMIT"
          python -I - <<'PY'
          import hashlib, os, pathlib, re
          data = os.environ['SELECTION_JSON'].encode('utf-8')
          expected = os.environ['SELECTION_SHA256']
          if not 0 < len(data) <= 32768 or not re.fullmatch('[0-9a-f]{64}', expected) or hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Reviewed bounded public selection differs from its independent digest.')
          with (pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-native-selection.json').open('xb') as stream:
              stream.write(data)
          PY
      - name: Acquire selected signed assets
        id: acquire
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          selected=$(python -B scripts/acquire_windows_qualification_inputs.py --source-root "$GITHUB_WORKSPACE"             --selection "$RUNNER_TEMP/windows-native-selection.json" --selection-sha256 "$SELECTION_SHA256"             --output "$RUNNER_TEMP/peerbrush-windows-inputs")
          if [[ ! "$selected" =~ ^[0-9a-f]{64}$ ]]; then exit 1; fi
          echo "sha256=$selected" >> "$GITHUB_OUTPUT"
      - name: Qualify selected final Windows installer
        env:
          QUALIFICATION_SELECTION_SHA256: ${{ steps.acquire.outputs.sha256 }}
        run: |
          python -B scripts/qualify_windows_installer.py --source-root "$GITHUB_WORKSPACE"             --selection "$RUNNER_TEMP/peerbrush-windows-inputs/qualification-selection.json"             --selection-sha256 "$QUALIFICATION_SELECTION_SHA256" --report-output "$RUNNER_TEMP/peerbrush-windows-report"
      - name: Attest generated native qualification
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/peerbrush-windows-report/windows-installer-qualification.json
          subject-name: windows-installer-qualification.json
          push-to-registry: false
          create-storage-record: false
          show-summary: false
      - name: Retain qualification and bundle
        env:
          SELECTED_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python -I - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from package_macos_dmg import bounded_file, private_inspection_directory
          from acquire_windows_qualification_inputs import stable_source
          from package_msix import package_version
          from production_readiness import unique_fields
          from final_release import read
          source = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          version = stable_source(source, os.environ['SELECTED_COMMIT'])
          descriptor = 'PeerBrush-' + package_version(version) + '-Windows-x64.appinstaller'
          output = private_inspection_directory(pathlib.Path(os.environ['RUNNER_TEMP']) / 'peerbrush-windows-evidence', source, fresh=True)
          output.mkdir(mode=0o700)
          try:
              for path, name, limit in [
                  (pathlib.Path(os.environ['RUNNER_TEMP']) / 'peerbrush-windows-report/windows-installer-qualification.json', 'windows-installer-qualification.json', 16384),
                  (pathlib.Path(os.environ['SELECTED_BUNDLE']), 'windows-installer-qualification.sigstore.json', 2097152),
                  (pathlib.Path(os.environ['RUNNER_TEMP']) / 'peerbrush-windows-descriptor' / descriptor, descriptor, 16384),
              ]:
                  checksum, size = bounded_file(path, limit, output / name)
                  if name == 'windows-installer-qualification.json':
                      report_sha256 = checksum
                  if bounded_file(output / name, limit) != (checksum, size):
                      raise ValueError('Native evidence copy changed.')
              native = json.loads(read(output / 'windows-installer-qualification.json', 16384, report_sha256), object_pairs_hook=unique_fields)
              if (native['descriptor']['file'] != descriptor
                      or bounded_file(output / descriptor, 16384)[0] != native['descriptor']['sha256']):
                  raise ValueError('Actual descriptor differs from its native qualification binding.')
          except Exception:
              raise SystemExit('Native Windows evidence could not be retained; no handoff is available.') from None
          PY
      - name: Upload qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/peerbrush-windows-evidence/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
