name: PeerBrush release candidates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full commit SHA matching the selected workflow ref
        required: true
        type: string
      sign_sigstore:
        description: Sign and verify the candidates with Sigstore
        required: true
        default: false
        type: boolean

      build_store_msix:
        description: Prepare unsigned Microsoft Store submission candidate (no upload)
        required: true
        default: false
        type: boolean
      store_package_version:
        description: Optional approved Store version A.B.C.0; blank maps Cargo version
        required: false
        type: string
      previous_store_version:
        description: Previous published Store version A.B.C.0; required for upgrades
        required: false
        type: string

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.sha }}
          persist-credentials: false
      - name: Check exact release source
        shell: bash
        run: python scripts/release_gate.py --commit "$EXPECTED_COMMIT"
      - name: Check committed package source
        run: python scripts/package.py --check-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev dpkg-dev desktop-file-utils libfontconfig1
      - run: python -B scripts/test_ci_diagnostics.py
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - name: Verify native installed-font inventory without registration
        run: cargo test --locked --lib fonts::tests::native_enumeration_reports_exact_selectable_faces_without_paths -- --ignored --exact
      - run: cargo test --locked -p egui-winit --lib peerbrush_clipboard_tests
      - if: runner.os == 'Windows'
        run: cargo test --locked --test clipboard -- --ignored
      - run: cargo clippy --all-targets --locked
      - name: Verify native macOS document delivery and icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo run --locked --example macos_activation
          sips -s format png assets/peerbrush.icns --out "$RUNNER_TEMP/peerbrush-icon.png"
      - run: python scripts/test_package.py
      - run: python scripts/test_msix.py
      - run: python scripts/test_sign_macos.py
      - run: python -B scripts/test_deb.py
      - run: python -B scripts/test_macos_dmg.py
      - run: python -B scripts/test_final_macos_dmg.py
      - run: python -B scripts/test_sign_macos_dmg.py
      - name: Native DMG round trip with synthetic unsigned data
        if: runner.os == 'macOS'
        run: python3 -B scripts/test_macos_dmg_native.py
      - run: python -B scripts/test_prepare_sparkle.py
      - name: Verify disabled native Sparkle preparation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/Sparkle-2.10.0.zip" 'https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip'
          python3 -B scripts/prepare_sparkle.py --archive "$RUNNER_TEMP/Sparkle-2.10.0.zip" --output "$RUNNER_TEMP/peerbrush-sparkle-preparation"
          cargo run --locked --example sparkle_preparation -- "$RUNNER_TEMP/peerbrush-sparkle-preparation/Sparkle.framework"
      - run: python scripts/test_submit_store_release.py
      - run: python scripts/test_store_release_state.py
      - run: python scripts/test_production_readiness.py
      - run: python -B scripts/test_prepare_site_release.py
      - run: python -B scripts/test_readback_site_release.py
      - run: python scripts/build_release.py
      - run: python scripts/test_msix_runtime_tests.py
      - run: python scripts/package.py
      - name: Build and test Ubuntu installation candidate in a disposable container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          PORTABLE="dist/PeerBrush-$VERSION-Linux-x64.zip"
          DIGEST=$(sha256sum "$PORTABLE" | cut -d ' ' -f 1)
          python3 -B scripts/package_deb.py --portable "$PORTABLE" --portable-sha256 "$DIGEST" --output dist/deb --maintainer 'PeerBrush CI fixture <builds@example.invalid>'
          SOURCE_COMMIT=$(git rev-parse HEAD)
          HASHES=$(python3 -c 'import pathlib,sys; sys.path.insert(0,"scripts"); from verify_release import inspect_archive; record=inspect_archive(pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3])["manifest"]; print(record["executable_sha256"],record["source_sha256"])' "$PORTABLE" "$SOURCE_COMMIT" "$VERSION")
          read -r EXECUTABLE_SHA SOURCE_SHA <<< "$HASHES"
          set -- dist/deb/*.deb
          test "$#" -eq 1
          DEB="$1"
          DEB_SHA=$(sha256sum "$DEB" | cut -d ' ' -f 1)
          EVIDENCE=$(mktemp -d "$RUNNER_TEMP/peerbrush-deb-acceptance.XXXXXX")
          docker run --rm --env PEERBRUSH_DISPOSABLE_PACKAGE_TEST=1 --env DEBIAN_FRONTEND=noninteractive \
            --volume "$PWD/dist/deb:/packages:ro" --volume "$PWD/scripts:/checks:ro" --volume "$EVIDENCE:/evidence" ubuntu:24.04 \
            bash -eu -c 'apt-get update; apt-get install -y python3 xdg-utils shared-mime-info desktop-file-utils libfile-mimeinfo-perl file passwd; python3 -B /checks/test_deb_installation.py --package "/packages/$1" --package-sha256 "$2" --commit "$3" --version "$4" --executable-sha256 "$5" --source-sha256 "$6" --output /evidence/installation.json' \
            peerbrush-deb-acceptance "${DEB##*/}" "$DEB_SHA" "$SOURCE_COMMIT" "$VERSION" "$EXECUTABLE_SHA" "$SOURCE_SHA"
          python3 -B scripts/production_readiness.py --deb "$DEB" --deb-sha256 "$DEB_SHA" \
            --portable "$PORTABLE" --portable-sha256 "$DIGEST" \
            --installation-receipt "$EVIDENCE/installation.json" --commit "$SOURCE_COMMIT" --version "$VERSION" \
            --maintainer 'PeerBrush CI fixture <builds@example.invalid>' --output "$DEB.qualification.json"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: DEB-installation-candidate
          path: dist/deb/*
          if-no-files-found: error
      - name: Prepare exact-identity Store MSIX candidate
        if: runner.os == 'Windows' && inputs.build_store_msix
        shell: pwsh
        env:
          STORE_PACKAGE_VERSION: ${{ inputs.store_package_version }}
          PREVIOUS_STORE_VERSION: ${{ inputs.previous_store_version }}
        run: |
          # Public Partner Center identity is committed and reviewed with source.
          $identityPath = 'packaging/msix/identity.store.json'
          $product = Get-Content -Raw 'packaging/msix/product.store.json' | ConvertFrom-Json
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])'
          $packageArgs = @('scripts/package_msix.py', '--portable', "dist/PeerBrush-$version-Windows-x64.zip", '--identity', $identityPath, '--expected-package-family', $product.package_family_name, '--output', 'dist/store-candidate')
          if ($env:STORE_PACKAGE_VERSION) { $packageArgs += @('--package-version', $env:STORE_PACKAGE_VERSION) }
          if (-not $env:PREVIOUS_STORE_VERSION) { throw 'Read the actual current Store version and supply previous_store_version before building an update candidate.' }
          $packageArgs += @('--previous-version', $env:PREVIOUS_STORE_VERSION)
          $packageArgs += @('--portable-sha256', (Get-FileHash -Algorithm SHA256 "dist/PeerBrush-$version-Windows-x64.zip").Hash.ToLowerInvariant())
          python @packageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && inputs.build_store_msix
        with:
          name: unsigned-store-msix-candidate
          path: dist/store-candidate/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

  inspect:
    needs: native
    runs-on: ubuntu-24.04
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidates
      - name: Download the same-workflow Ubuntu candidate
        uses: actions/download-artifact@v4
        with:
          name: DEB-installation-candidate
          path: deb-candidate
      - name: Inspect matching archives and checksums
        shell: bash
        run: |
          python scripts/release_gate.py --commit "$EXPECTED_COMMIT"
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python scripts/verify_release.py --directory candidates --commit "$EXPECTED_COMMIT" --version "$VERSION" --output verified-portable
          set -- deb-candidate/*.deb
          test "$#" -eq 1
          DEB="$1"
          DEB_SHA=$(sha256sum "$DEB" | cut -d ' ' -f 1)
          PORTABLE_SHA=$(sha256sum "verified-portable/PeerBrush-$VERSION-Linux-x64.zip" | cut -d ' ' -f 1)
          # Job success supplies producer provenance; report JSON grants no authority.
          python3 -B scripts/production_readiness.py --directory verified-portable --include-deb "$DEB" \
            --deb-sha256 "$DEB_SHA" --portable-sha256 "$PORTABLE_SHA" \
            --maintainer 'PeerBrush CI fixture <builds@example.invalid>' \
            --commit "$EXPECTED_COMMIT" --version "$VERSION" --output dist
          echo 'Exact-source candidate archives verified. Production publication remains blocked pending native signing, installed acceptance, protected approval and public asset reconciliation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-candidate
          path: dist/*
          if-no-files-found: error

  sign:
    if: inputs.sign_sigstore
    needs: inspect
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-candidate
          path: dist
      - name: Sign and verify packages, source and checksums
        uses: sigstore/gh-action-sigstore-python@a5caf349bc536fbef3668a10ed7f5cd309a4b53d # v3.2.0
        with:
          inputs: dist/*.zip dist/*.deb dist/SHA256SUMS dist/release-inventory.json
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: false
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-candidate
          path: dist/*
          if-no-files-found: error
