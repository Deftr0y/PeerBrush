name: PeerBrush website

on:
  workflow_dispatch:
    inputs:
      expected_site_commit:
        description: Full reviewed public site-content commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: site-content
          persist-credentials: false
      - name: Check reviewed public output
        shell: bash
        env:
          EXPECTED_SITE_COMMIT: ${{ inputs.expected_site_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SITE_COMMIT"
          test -f public-site/index.html
          test -f public-site/downloads.json
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload reviewed website output
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
