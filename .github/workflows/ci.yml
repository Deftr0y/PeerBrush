name: PeerBrush
on: [push, pull_request]
permissions:
  contents: read
jobs:
  branch-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify branch-policy regressions
        run: python scripts/test_branch_policy.py
      - name: Enforce branch names and PR destinations
        shell: bash
        run: python scripts/check_branch_policy.py --event "$GITHUB_EVENT_PATH" --ref "$GITHUB_REF"
  attribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved human attribution throughout branch history
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          registry = json.loads(Path('.github/human-contributors.json').read_text())
          humans = {digest for values in registry['humans'].values() for digest in values}
          committers = humans | {digest for values in registry['committer_services'].values() for digest in values}
          def require(identity, allowed, commit):
              digest = hashlib.sha256(identity.strip().lower().encode()).hexdigest()
              if digest not in allowed:
                  raise SystemExit(f'{commit}: unapproved Git contributor identity. Only verified humans may be authors or co-authors; AI identities are prohibited.')
          history = subprocess.check_output(['git', 'log', '--format=%H%n%an%n%ae%n%cn%n%ce%n%B%x00', 'HEAD'], text=True)
          commits = [record.lstrip('\n') for record in history.split('\0') if record.strip()]
          for record in commits:
              commit, author, author_email, committer, committer_email, *message = record.splitlines()
              require(f'{author} <{author_email}>', humans, commit)
              require(f'{committer} <{committer_email}>', committers, commit)
              for line in message:
                  trailer = re.match(r'(?i)\s*co-authored-by\s*:\s*(.*)', line)
                  if trailer:
                      require(trailer[1], humans, commit)
          print(f'Checked approved human attribution for {len(commits)} commits.')
          PY
  native:
    needs: [branch-policy, attribution]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check committed package source
        run: python scripts/package.py --check-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-docs
      - name: Identify compiler cache
        id: compiler
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          version = subprocess.check_output(['rustc', '--version'], text=True).split()[1]
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Unexpected stable compiler version')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
          PY
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5, Node.js 24
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            target
          key: peerbrush-build-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'scripts/build_release.py') }}
          restore-keys: |
            peerbrush-build-v1-${{ matrix.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev dpkg-dev desktop-file-utils
      - run: cargo fmt --all -- --check
      - name: Run regression tests and summarize failures
        shell: bash
        run: |
          set +e
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/peerbrush-tests.log"
          test_status=${PIPESTATUS[0]}
          python - "$RUNNER_TEMP/peerbrush-tests.log" "$GITHUB_STEP_SUMMARY" "$test_status" <<'PY'
          import re, sys
          from pathlib import Path
          log = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          failures = re.findall(r'^test ([A-Za-z0-9_:]+) \.\.\. FAILED$', log, re.M)
          results = re.findall(r'^test result: (?:ok|FAILED)\. [0-9]+ passed; [0-9]+ failed; [0-9]+ ignored;', log, re.M)
          if failures:
              print('::error title=Regression test failures::' + ', '.join(name[:128] for name in failures[:32]))
              locations = re.findall(r"^thread '([A-Za-z0-9_:]+)' (?:\([0-9]+\) )?panicked at (?:[^\r\n]*?[/\\])?((?:tests|src)[/\\][A-Za-z0-9_./\\-]+):([0-9]+):([0-9]+)", log, re.M)
              for name, path, line, column in locations[:32]:
                  path = path.replace('\\', '/')
                  if name in failures and '..' not in path.split('/'):
                      print(f'::error file={path[:256]},line={int(line)},col={int(column)},title=Regression failure location::{name[:128]}')
              sections = re.split(r'^---- ([A-Za-z0-9_:]+) stdout ----$', log, flags=re.M)
              kinds = {
                  'OWNERSHIP_BUSY': 'File already open',
                  'SAVE_BUSY': 'Another PeerBrush save',
                  'BACKUP_STORAGE_FULL': 'Previous-save storage is full',
                  'PROJECT_HANDLE_MISSING': 'Missing or closed project ID',
                  'PROJECT_SET_CHANGED': 'The open projects changed',
                  'SOURCE_CHANGED': 'File changed while opening',
                  'SOURCE_CONFLICT': 'Unsaved project: save first',
              }
              for index in range(1, len(sections) - 1, 2):
                  name, body = sections[index:index + 2]
                  if name in failures:
                      matched = [code for code, marker in kinds.items() if marker in body]
                      if matched:
                          print('::error title=Regression failure category::' + name[:128] + ': ' + ', '.join(matched))
          elif int(sys.argv[3]):
              codes = sorted(set(re.findall(r'^error\[(E[0-9]{4})\]', log, re.M)))
              detail = ', '.join(codes) if codes else 'No failing test identifier was reported'
              print('::error title=Regression test run failed::' + detail)
          # Publish only bounded test identifiers/counts, never arbitrary
          # panic output, environment values, paths or fixture contents.
          with Path(sys.argv[2]).open('a', encoding='utf-8') as summary:
              summary.write('### Regression tests\n\n')
              summary.write(f'Exit status: {int(sys.argv[3])}\n\n')
              summary.writelines(f'- `{line}`\n' for line in results[:100])
              if failures:
                  summary.write('\nFailed tests:\n\n')
                  summary.writelines(f'- `{name[:256]}`\n' for name in failures[:100])
          PY
          exit "$test_status"
      - run: cargo clippy --all-targets --locked
      - run: python scripts/test_package.py
      - run: python scripts/test_msix.py
      - run: python scripts/test_sign_macos.py
      - run: python -B scripts/test_deb.py
      - run: python -B scripts/test_macos_dmg.py
      - run: python -B scripts/test_sign_macos_dmg.py
      - name: Native DMG round trip with synthetic unsigned data
        if: runner.os == 'macOS'
        run: python3 -B scripts/test_macos_dmg_native.py
      - run: python scripts/test_submit_store_release.py
      - run: python scripts/build_release.py
      - run: python scripts/test_msix_runtime_tests.py
      - name: Package and report archive sizes
        shell: bash
        run: |
          python scripts/package.py
          python - <<'PY'
          import os, re
          from pathlib import Path
          rows = []
          for archive in sorted(Path('dist').glob('PeerBrush-*.zip')):
              if re.fullmatch(r'PeerBrush-[0-9A-Za-z.+-]{1,192}\.zip', archive.name):
                  rows.append((archive.name, archive.stat().st_size))
          for name, size in rows:
              print(f'::notice title=Verified package archive bytes::{name}: {size}')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('\n### Package archive sizes\n\n')
              summary.writelines(f'- `{name}`: {size:,} bytes\n' for name, size in rows)
          PY
      - name: Build and test Ubuntu installation candidate in a disposable container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          PORTABLE="dist/PeerBrush-$VERSION-Linux-x64.zip"
          DIGEST=$(sha256sum "$PORTABLE" | cut -d ' ' -f 1)
          python3 -B scripts/package_deb.py --portable "$PORTABLE" --portable-sha256 "$DIGEST" --output dist/deb --maintainer 'PeerBrush CI fixture <builds@example.invalid>'
          docker run --rm --env PEERBRUSH_DISPOSABLE_PACKAGE_TEST=1 --env DEBIAN_FRONTEND=noninteractive \
            --volume "$PWD/dist/deb:/packages:ro" --volume "$PWD/scripts:/checks:ro" ubuntu:24.04 \
            bash -eu -c 'apt-get update; apt-get install -y python3 xdg-utils shared-mime-info desktop-file-utils libfile-mimeinfo-perl file passwd; set -- /packages/*.deb; test "$#" -eq 1; python3 -B /checks/test_deb_installation.py --package "$1"'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: DEB-installation-candidate
          path: dist/deb/*
          if-no-files-found: error
      - name: Build unsigned MSIX with explicit local-test identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])'
          python scripts/package_msix.py --portable "dist/PeerBrush-$version-Windows-x64.zip" --development-identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MSIX-local-test
          path: dist/msix/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PeerBrush-${{ runner.os }}
          path: dist/*.zip

  inspect:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: PeerBrush-*
          path: candidates
      - name: Inspect matching platform archives and source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python scripts/verify_release.py --directory candidates --commit "$EXPECTED_COMMIT" --version "$VERSION" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: dist/*
          if-no-files-found: error
