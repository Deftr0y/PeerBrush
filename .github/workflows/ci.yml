name: Historical PeerBrush packaging correction
on:
  push:
    branches: ['codex/historical-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked
      - run: python scripts/test_package.py
      - run: python scripts/build_release.py
      - run: python scripts/package_checkpoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-${{ runner.os }}
          path: verified/*
          if-no-files-found: error
