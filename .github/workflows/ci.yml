name: PeerBrush
on: [push, pull_request]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check new commit attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess
          base, head = os.environ['BASE'], os.environ['HEAD']
          def exists(ref):
              return subprocess.run(['git', 'cat-file', '-e', ref + '^{commit}'], stderr=subprocess.DEVNULL).returncode == 0
          revision = [head]
          if base and set(base) != {'0'} and exists(base):
              revision += ['--not', base]
          elif os.environ['CURRENT_BRANCH'] != os.environ['DEFAULT_BRANCH']:
              default = 'origin/' + os.environ['DEFAULT_BRANCH']
              if exists(default):
                  revision += ['--not', default]
          commits = subprocess.check_output(['git', 'rev-list', *revision], text=True).splitlines()
          for commit in commits:
              text = subprocess.check_output(['git', 'show', '-s', '--format=%an%n%ae%n%cn%n%ce%n%B', commit], text=True)
              identity = '\n'.join(text.splitlines()[:4])
              trailers = '\n'.join(line for line in text.splitlines()[4:] if re.match(r'(?i)\s*co-authored-by\s*:', line))
              if re.search(r'(?i)\bcodex\b|codex@openai\.com', identity + '\n' + trailers):
                  raise SystemExit(f'{commit}: AI tools must not be credited as Git contributors. Use the human contributor identity and keep the README disclosure.')
          print(f'Checked attribution for {len(commits)} new commits.')
          PY
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check committed package source
        run: python scripts/package.py --check-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked
      - run: python scripts/test_package.py
      - run: python scripts/build_release.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: PeerBrush-${{ runner.os }}
          path: dist/*.zip

  inspect:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: PeerBrush-*
          path: candidates
      - name: Inspect matching platform archives and source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python scripts/verify_release.py --directory candidates --commit "$EXPECTED_COMMIT" --version "$VERSION" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: dist/*
          if-no-files-found: error
