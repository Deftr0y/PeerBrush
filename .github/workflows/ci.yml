name: PeerBrush
on: [push, pull_request]
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require approved human attribution throughout branch history
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          registry = json.loads(Path('.github/human-contributors.json').read_text())
          humans = {digest for values in registry['humans'].values() for digest in values}
          committers = humans | {digest for values in registry['committer_services'].values() for digest in values}
          def require(identity, allowed, commit):
              digest = hashlib.sha256(identity.strip().lower().encode()).hexdigest()
              if digest not in allowed:
                  raise SystemExit(f'{commit}: unapproved Git contributor identity. Only verified humans may be authors or co-authors; AI identities are prohibited.')
          history = subprocess.check_output(['git', 'log', '--format=%H%n%an%n%ae%n%cn%n%ce%n%B%x00', 'HEAD'], text=True)
          commits = [record.lstrip('\n') for record in history.split('\0') if record.strip()]
          for record in commits:
              commit, author, author_email, committer, committer_email, *message = record.splitlines()
              require(f'{author} <{author_email}>', humans, commit)
              require(f'{committer} <{committer_email}>', committers, commit)
              for line in message:
                  trailer = re.match(r'(?i)\s*co-authored-by\s*:\s*(.*)', line)
                  if trailer:
                      require(trailer[1], humans, commit)
          print(f'Checked approved human attribution for {len(commits)} commits.')
          PY
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check committed package source
        run: python scripts/package.py --check-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked
      - run: python scripts/test_package.py
      - run: python scripts/build_release.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: PeerBrush-${{ runner.os }}
          path: dist/*.zip

  inspect:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: PeerBrush-*
          path: candidates
      - name: Inspect matching platform archives and source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          python scripts/verify_release.py --directory candidates --commit "$EXPECTED_COMMIT" --version "$VERSION" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: dist/*
          if-no-files-found: error
