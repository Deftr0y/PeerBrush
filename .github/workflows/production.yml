name: PeerBrush production preparation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main SHA; all final inputs must bind this source
        type: string
        required: true
      candidate_run_id:
        description: Successful same-source release-candidate run; data inputs only
        type: string
        required: true
      final_inputs_run_id:
        description: Independent successful final-inputs.yml producer run ID
        type: string
        required: true
      final_inputs_artifact_id:
        description: Exact selected final-input data artifact ID
        type: string
        required: true
      final_inputs_artifact_sha256:
        description: Independent outer Actions artifact SHA-256
        type: string
        required: true
      final_inputs_bundle_sha256:
        description: Independent inner final-inputs.zip SHA-256
        type: string
        required: true
      final_inputs_index_sha256:
        description: Independent strict final-inputs.json SHA-256
        type: string
        required: true
      selection_sha256:
        description: Independent portable selection.json SHA-256; selectors never grant readiness
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'Deftr0y/PeerBrush' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact source and existing version checks
        run: python -B scripts/release_gate.py --commit "$EXPECTED_COMMIT"
      - name: Verify offline composition and transaction contracts
        run: |
          python -B scripts/test_final_release.py
          python -B scripts/test_final_inputs.py
          python -B scripts/test_publish_release.py
      - name: Report disabled production authority
        run: |
          echo 'Final composition and immutable transaction are prepared. Windows signing/qualification handoff is prepared but inactive and unverified. Authenticated installed producers and complete native acceptance remain source work; publication and Store submission are disabled.' >> "$GITHUB_STEP_SUMMARY"

  compose:
    # Explicit activation and independent authority provisioning remain required.
    if: ${{ false }}
    needs: gate
    runs-on: ubuntu-24.04
    environment: production-preparation
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      FINAL_INPUTS_RUN: ${{ inputs.final_inputs_run_id }}
      FINAL_INPUTS_ARTIFACT: ${{ inputs.final_inputs_artifact_id }}
      FINAL_INPUTS_ARTIFACT_SHA256: ${{ inputs.final_inputs_artifact_sha256 }}
      FINAL_INPUTS_BUNDLE_SHA256: ${{ inputs.final_inputs_bundle_sha256 }}
      FINAL_INPUTS_INDEX_SHA256: ${{ inputs.final_inputs_index_sha256 }}
      SELECTION_SHA256: ${{ inputs.selection_sha256 }}
    steps:
      - name: Require exact reviewed production invocation
        run: |
          python -I - <<'PY'
          import os, re
          expected = os.environ['EXPECTED_COMMIT']
          if (not re.fullmatch('[0-9a-f]{40}', expected)
                  or os.environ.get('GITHUB_SHA') != expected or os.environ.get('GITHUB_WORKFLOW_SHA') != expected
                  or os.environ.get('GITHUB_REPOSITORY') != 'Deftr0y/PeerBrush'
                  or os.environ.get('GITHUB_REF') != 'refs/heads/main'
                  or os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch'
                  or os.environ.get('GITHUB_WORKFLOW_REF') != 'Deftr0y/PeerBrush/.github/workflows/production.yml@refs/heads/main'):
              raise SystemExit('Require reviewed exact main production preparation.')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact source
        run: python -B scripts/release_gate.py --commit "$EXPECTED_COMMIT"
      - name: Acquire separate exact final-input producer data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python -B scripts/acquire_final_inputs.py --source-root "$GITHUB_WORKSPACE" \
            --commit "$EXPECTED_COMMIT" --candidate-run-id "$CANDIDATE_RUN" \
            --run-id "$FINAL_INPUTS_RUN" --artifact-id "$FINAL_INPUTS_ARTIFACT" \
            --artifact-sha256 "$FINAL_INPUTS_ARTIFACT_SHA256" --bundle-sha256 "$FINAL_INPUTS_BUNDLE_SHA256" \
            --index-sha256 "$FINAL_INPUTS_INDEX_SHA256" --selection-sha256 "$SELECTION_SHA256" \
            --output "$RUNNER_TEMP/peerbrush-final-inputs"
      - name: Revalidate all selected native inputs through actual final composition
        run: |
          set +e
          python -B scripts/prepare_final_inputs.py consume --source-root "$GITHUB_WORKSPACE" \
            --directory "$RUNNER_TEMP/peerbrush-final-inputs/data" \
            --selection "$RUNNER_TEMP/peerbrush-final-inputs/data/selection.json" --selection-sha256 "$SELECTION_SHA256" \
            --index "$RUNNER_TEMP/peerbrush-final-inputs/final-inputs.json" --index-sha256 "$FINAL_INPUTS_INDEX_SHA256" \
            --work "$RUNNER_TEMP/peerbrush-final-verification" --output "$RUNNER_TEMP/peerbrush-final-candidate"
          result=$?
          set -e
          if [ "$result" -ne 2 ]; then exit 1; fi
          echo 'Final byte composition retained; installed/public/production authority remains blocked.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact public candidate files only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-release-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/peerbrush-final-candidate/*
          if-no-files-found: error


  publish:
    # No write authority is requested until the missing authenticated native
    # signing/installed producers, explicit release approval and public readback
    # are reviewed and wired. A variable or uploaded ready JSON cannot enable it.
    if: ${{ false }}
    needs: compose
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Publication remains disabled pending native producer implementation and explicit approval.'
