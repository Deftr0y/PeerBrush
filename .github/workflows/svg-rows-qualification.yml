name: SVG row renderer qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/svg-rows-qualification.yml'
      - 'vendor/tiny-skia/**'
      - 'vendor/tiny-skia-path/**'
      - 'vendor/resvg/**'
      - 'vendor/renderer-provenance.json'
      - 'tests/svg-origin-*'
      - 'tests/svg-origin-*/**'
      - 'scripts/test_svg_rows.py'
permissions:
  contents: read
jobs:
  exact-primitive-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # Rust1.92.0
        with:
          toolchain: 1.92.0
      - name: Compare independent registry renderer and bounded rows exactly
        run: python -B scripts/test_svg_rows.py
