[package]
name = "peerbrush"
version = "0.1.4"
edition = "2021"
license = "GPL-3.0-only"
description = "You and your AI. Same canvas."

[dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "ico", "pnm", "tga", "qoi"] }
moxcms = "0.8.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
flate2 = "1"
base64 = "0.22"
bytemuck = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json"] }
rfd = "0.15"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true


[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
